<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="General.css">

</head>
<body>
    <h1>Bienvenido, <span id="nombreUsuario"></span>!</h1>
    <h2>Banco: <span id="bancoActual"></span></h2>
    <h2>Tu saldo es: <span id="saldo">$0</span></h2>

    <section>
     <button onclick="mostrarFormularioTransferencia()">Transferir</button>
     <button onclick="ingresarDinero()">Ingresar Dinero</button>
     <button onclick="eliminarCuenta()">Eliminar cuenta</button>
     <a href="Index.html"><button>Volver</button></a>
    </section>

    <div id="modalTransferencia" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <h2>Realizar Transferencia</h2>
            <form id="formTransferencia">
                <div class="input-group">
                    <label for="bancoDestino">Banco Destino:</label>
                    <select id="bancoDestino" required>
                        <option value="">Seleccione un banco</option>
                        <option value="MazeBank">Maze Bank</option>
                        <option value="PacificBank">Pacific Bank</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="cuentaDestino">Número de Cuenta:</label>
                    <input type="text" id="cuentaDestino" required>
                </div>
                
                <div class="input-group">
                    <label for="montoTransferencia">Monto:</label>
                    <input type="number" id="montoTransferencia" min="0.01" step="0.01" required>
                </div>
                
                <div class="button-group">
                    <button type="submit">Confirmar Transferencia</button>
                    <button type="button" onclick="cerrarModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="Principal.Js"></script>
</body>
</html>
